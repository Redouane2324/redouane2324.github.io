<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SolPay Africa — Solana Payments</title>

<meta name="description" content="SolPay Africa - Simple Solana payments for Africa.">

<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  padding:18px 20px;
  background:#0b1628;
  border-bottom:1px solid #1e293b;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.network{
  font-size:12px;
  color:#4ade80;
  background:#0f241c;
  border:1px solid #166534;
  padding:7px 11px;
  border-radius:20px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:30px 18px 60px;
}

.hero{
  text-align:center;
  padding:35px 10px 25px;
}

.hero h1{
  margin:0 0 12px;
  font-size:42px;
}

.hero p{
  margin:0;
  color:#94a3b8;
  font-size:16px;
}

.card{
  background:#111d2f;
  border:1px solid #223047;
  padding:25px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  color:#cbd5e1;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:8px;
  background:#07111f;
  color:#fff;
  border:1px solid #334155;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#8b5cf6;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#7c3aed;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  font-size:15px;
}

button:hover{
  background:#8b5cf6;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.secondary{
  background:#1e293b;
}

.result{
  margin-top:18px;
  padding:16px;
  background:#07111f;
  border:1px solid #263449;
  border-radius:12px;
  word-break:break-word;
}

.success{
  color:#4ade80;
}

.pending{
  color:#facc15;
}

.error{
  color:#f87171;
}

.wallet{
  margin-top:15px;
  padding:13px;
  background:#07111f;
  border-radius:10px;
  font-size:12px;
  word-break:break-all;
  color:#94a3b8;
}

.qr{
  background:#fff;
  padding:15px;
  display:inline-block;
  border-radius:12px;
}

.qr-wrap{
  text-align:center;
}

.info{
  background:#0b1628;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  line-height:1.7;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:25px 10px;
}

a{
  color:#a78bfa;
  text-decoration:none;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#1e1b4b;
  color:#c4b5fd;
  font-size:12px;
  margin-bottom:15px;
}

@media(max-width:600px){
  .hero h1{
    font-size:32px;
  }

  .card{
    padding:20px;
  }

  header{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SolPay Africa</div>
  <div class="network">● Solana Devnet</div>
</header>

<div class="container">

  <section class="hero">
    <div class="badge">SOLANA PAYMENT INFRASTRUCTURE</div>
    <h1>Simple. Fast. Solana.</h1>
    <p>Accept Solana payments with SolPay Africa.</p>
  </section>

  <!-- CREATE PAYMENT -->

  <div class="card">

    <h2>Create Payment</h2>

    <label for="amount">Amount (SOL)</label>

    <input
      id="amount"
      type="number"
      min="0.000001"
      step="0.000001"
      placeholder="0.001"
    >

    <label for="description">Description</label>

    <input
      id="description"
      type="text"
      maxlength="200"
      placeholder="Product or service"
    >

    <button id="createButton" onclick="createPayment()">
      Create Payment
    </button>

    <div
      id="createResult"
      class="result"
      style="display:none"
    ></div>

  </div>

  <!-- PAYMENT -->

  <div
    id="paymentCard"
    class="card"
    style="display:none"
  >

    <h2>Payment</h2>

    <div id="paymentInfo" class="info"></div>

    <button
      id="connectButton"
      onclick="connectWallet()"
    >
      Connect Phantom
    </button>

    <div
      id="wallet"
      class="wallet"
      style="display:none"
    ></div>

    <button
      id="payButton"
      onclick="payPayment()"
      disabled
    >
      Pay with Phantom
    </button>

    <div
      id="paymentResult"
      class="result"
      style="display:none"
    ></div>

  </div>

  <!-- QR -->

  <div
    id="qrCard"
    class="card"
    style="display:none"
  >

    <h2>Payment QR</h2>

    <p style="color:#94a3b8">
      Scan this QR code to open the payment.
    </p>

    <div class="qr-wrap">
      <div id="qrcode" class="qr"></div>
    </div>

  </div>

</div>

<div class="footer">
  SolPay Africa · Solana Devnet · Payment MVP
</div>


<script>

const API =
  "https://redouane2324-solpay.onrender.com";

const SOLANA_RPC =
  "https://api.devnet.solana.com";

let provider = null;
let wallet = null;
let payment = null;


/* =========================
   PHANTOM
========================= */

function getProvider(){

  if(
    window.phantom &&
    window.phantom.solana
  ){
    return window.phantom.solana;
  }

  if(
    window.solana &&
    window.solana.isPhantom
  ){
    return window.solana;
  }

  return null;
}


/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

  provider = getProvider();

  if(!provider){

    alert(
      "Phantom wallet was not detected. Open this website using Phantom."
    );

    return;
  }

  try{

    const response =
      await provider.connect();

    wallet =
      response.publicKey.toString();

    document.getElementById(
      "connectButton"
    ).innerText =
      "Wallet Connected ✓";

    const walletBox =
      document.getElementById("wallet");

    walletBox.style.display =
      "block";

    walletBox.innerText =
      wallet;

    document.getElementById(
      "payButton"
    ).disabled = false;

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Wallet connection cancelled."
    );

  }

}


/* =========================
   CREATE PAYMENT
========================= */

async function createPayment(){

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );

  const description =
    document.getElementById(
      "description"
    ).value.trim() ||
    "SolPay Payment";

  const result =
    document.getElementById(
      "createResult"
    );

  const button =
    document.getElementById(
      "createButton"
    );

  result.style.display =
    "block";

  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    result.innerHTML =
      '<span class="error">Please enter a valid amount.</span>';

    return;
  }

  button.disabled = true;
  button.innerText =
    "Creating...";

  try{

    const response =
      await fetch(
        API + "/api/payments",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            amount,
            description
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Unable to create payment"
      );

    }

    payment = data;

    showPayment(data);

    createQR(data);

    result.innerHTML = `
      <span class="success">
        Payment created successfully ✓
      </span>
      <br><br>
      Payment ID:
      <strong>${escapeHTML(data.paymentId)}</strong>
    `;

  }catch(error){

    console.error(error);

    result.innerHTML =
      `<span class="error">${escapeHTML(error.message)}</span>`;

  }finally{

    button.disabled = false;
    button.innerText =
      "Create Payment";

  }

}


/* =========================
   SHOW PAYMENT
========================= */

function showPayment(data){

  document.getElementById(
    "paymentCard"
  ).style.display =
    "block";

  document.getElementById(
    "paymentInfo"
  ).innerHTML = `

    <div>
      <strong>Payment ID</strong><br>
      ${escapeHTML(data.paymentId)}
    </div>

    <br>

    <div>
      <strong>Amount</strong><br>
      ${Number(data.amount)} SOL
    </div>

    <br>

    <div>
      <strong>Description</strong><br>
      ${escapeHTML(data.description || "SolPay Payment")}
    </div>

    <br>

    <div>
      <strong>Status</strong><br>
      <span class="pending">
        ${escapeHTML(data.status)}
      </span>
    </div>

    <br>

    <div>
      <strong>Merchant</strong><br>
      ${escapeHTML(data.merchant)}
    </div>

  `;

}


/* =========================
   QR CODE
========================= */

function createQR(data){

  document.getElementById(
    "qrCard"
  ).style.display =
    "block";

  const qr =
    document.getElementById(
      "qrcode"
    );

  qr.innerHTML = "";

  const url =
    window.location.origin +
    window.location.pathname +
    "?payment=" +
    encodeURIComponent(
      data.paymentId
    );

  new QRCode(
    qr,
    {
      text:url,
      width:220,
      height:220
    }
  );

}


/* =========================
   PAY
========================= */

async function payPayment(){

  if(!payment){

    alert(
      "Payment information is missing."
    );

    return;
  }

  provider =
    getProvider();

  if(!provider){

    alert(
      "Phantom wallet was not detected."
    );

    return;
  }

  if(!wallet){

    await connectWallet();

    if(!wallet){
      return;
    }

  }

  const button =
    document.getElementById(
      "payButton"
    );

  const result =
    document.getElementById(
      "paymentResult"
    );

  button.disabled = true;
  button.innerText =
    "Preparing...";

  result.style.display =
    "block";

  try{

    const {
      Connection,
      PublicKey,
      SystemProgram,
      Transaction,
      LAMPORTS_PER_SOL
    } = solanaWeb3;

    const connection =
      new Connection(
        SOLANA_RPC,
        "confirmed"
      );

    const from =
      new PublicKey(wallet);

    const to =
      new PublicKey(
        payment.merchant
      );

    const lamports =
      Math.round(
        Number(payment.amount) *
        LAMPORTS_PER_SOL
      );

    const transaction =
      new Transaction();

    transaction.add(
      SystemProgram.transfer({
        fromPubkey:from,
        toPubkey:to,
        lamports
      })
    );

    const latest =
      await connection.getLatestBlockhash(
        "confirmed"
      );

    transaction.recentBlockhash =
      latest.blockhash;

    transaction.feePayer =
      from;

    button.innerText =
      "Approve in Phantom";

    const sent =
      await provider.signAndSendTransaction(
        transaction
      );

    const signature =
      sent.signature;

    result.innerHTML = `
      <span class="pending">
        Transaction sent. Verifying...
      </span>
    `;

    await connection.confirmTransaction(
      {
        signature,
        blockhash:
          latest.blockhash,
        lastValidBlockHeight:
          latest.lastValidBlockHeight
      },
      "confirmed"
    );

    const verify =
      await fetch(
        API +
        "/api/payments/" +
        encodeURIComponent(
          payment.paymentId
        ) +
        "/verify",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            signature
          })
        }
      );

    const data =
      await verify.json();

    if(data.paid){

      result.innerHTML = `

        <h2 class="success">
          Payment Successful ✓
        </h2>

        <p>
          Amount:
          <strong>${Number(data.amount)} SOL</strong>
        </p>

        <p>
          Status:
          <strong>Paid</strong>
        </p>

        <p>
          Payment ID:
          ${escapeHTML(data.paymentId)}
        </p>

        <p>
          <a
            target="_blank"
            rel="noopener"
            href="https://explorer.solana.com/tx/${encodeURIComponent(signature)}?cluster=devnet"
          >
            View transaction on Solana Explorer →
          </a>
        </p>

      `;

      button.innerText =
        "Paid ✓";

      payment.status =
        "Paid";

    }else{

      result.innerHTML =
        `<span class="error">
          ${escapeHTML(
            data.error ||
            "Payment verification failed"
          )}
        </span>`;

      button.disabled =
        false;

      button.innerText =
        "Pay with Phantom";

    }

  }catch(error){

    console.error(error);

    result.innerHTML =
      `<span class="error">
        ${escapeHTML(
          error.message ||
          "Payment failed"
        )}
      </span>`;

    button.disabled =
      false;

    button.innerText =
      "Pay with Phantom";

  }

}


/* =========================
   LOAD PAYMENT FROM QR
========================= */

async function loadPayment(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const paymentId =
    params.get("payment");

  if(!paymentId){
    return;
  }

  try{

    const response =
      await fetch(
        API +
        "/api/payments/" +
        encodeURIComponent(
          paymentId
        )
      );

    if(!response.ok){

      throw new Error(
        "Payment not found"
      );

    }

    const data =
      await response.json();

    payment =
      data;

    showPayment(data);

    document.getElementById(
      "createResult"
    ).style.display =
      "block";

    document.getElementById(
      "createResult"
    ).innerHTML = `
      <span class="success">
        Payment request loaded ✓
      </span>
    `;

  }catch(error){

    console.error(error);

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadPayment();

</script>

</body>
</html>
