<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SolPay Africa</title>

<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
header{padding:20px;background:#111827;display:flex;justify-content:space-between}
.container{max-width:850px;margin:auto;padding:25px}
.card{background:#1e293b;padding:25px;border-radius:18px;margin-bottom:20px}
input{width:100%;padding:14px;margin:8px 0 15px;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:9px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px}
button:disabled{opacity:.5}
.result{margin-top:18px;padding:15px;background:#0f172a;border-radius:10px;word-break:break-word}
.success{color:#4ade80}
.pending{color:#facc15}
.error{color:#f87171}
.wallet{margin-top:12px;padding:12px;background:#0f172a;border-radius:8px;font-size:12px;word-break:break-all}
.qr{background:#fff;padding:15px;display:inline-block;border-radius:10px}
</style>
</head>

<body>

<header>
<strong>SolPay Africa</strong>
<span>Solana Devnet</span>
</header>

<div class="container">

<div class="card">
<h2>Create Payment</h2>

<label>Amount (SOL)</label>
<input id="amount" type="number" min="0.000001" step="0.000001" placeholder="0.001">

<label>Description</label>
<input id="description" placeholder="Product or service">

<button onclick="createPayment()">Create Payment</button>

<div id="createResult" class="result" style="display:none"></div>
</div>


<div id="paymentCard" class="card" style="display:none">

<h2>Pay</h2>

<div id="paymentInfo"></div>

<button id="connectButton" onclick="connectWallet()">
Connect Phantom
</button>

<div id="wallet" class="wallet" style="display:none"></div>

<button id="payButton" onclick="payPayment()" disabled>
Pay with Phantom
</button>

<div id="paymentResult" class="result" style="display:none"></div>

</div>


<div id="qrCard" class="card" style="display:none">

<h2>Payment QR</h2>

<div id="qrcode" class="qr"></div>

</div>

</div>


<script>

const API =
"https://redouane2324-solpay.onrender.com";

let provider=null;
let wallet=null;
let payment=null;


function getProvider(){

if(window.phantom && window.phantom.solana)
return window.phantom.solana;

if(window.solana && window.solana.isPhantom)
return window.solana;

return null;

}


async function connectWallet(){

provider=getProvider();

if(!provider){

alert("Open this page inside Phantom browser.");
return;

}

try{

const response=await provider.connect();

wallet=response.publicKey.toString();

document.getElementById("connectButton").innerText=
"Wallet Connected";

const box=document.getElementById("wallet");

box.style.display="block";
box.innerText=wallet;

document.getElementById("payButton").disabled=false;

}catch(error){

console.error(error);

}

}


async function createPayment(){

const amount=Number(
document.getElementById("amount").value
);

const description=
document.getElementById("description").value ||
"SolPay Payment";

const result=
document.getElementById("createResult");

result.style.display="block";


if(!Number.isFinite(amount) || amount<=0){

result.innerHTML=
'<span class="error">Invalid amount.</span>';

return;

}


try{

const response=await fetch(
API+"/api/payments",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
amount,
description
})
}
);

const data=await response.json();

if(!response.ok)
throw new Error(data.error || "Unable to create payment");

payment=data;

document.getElementById("paymentCard").style.display="block";

document.getElementById("paymentInfo").innerHTML=`

<p><strong>Payment ID:</strong><br>
${data.paymentId}</p>

<p><strong>Amount:</strong>
${data.amount} SOL</p>

<p><strong>Status:</strong>
<span class="pending">${data.status}</span></p>

<p><strong>Merchant:</strong><br>
${data.merchant}</p>
`;

result.innerHTML=`
<span class="success">
Payment created successfully.
</span>
<br><br>
Payment ID: ${data.paymentId}
`;

createQR(data);

}catch(error){

result.innerHTML=
`<span class="error">${error.message}</span>`;

}

}


function createQR(data){

document.getElementById("qrCard").style.display="block";

const qr=document.getElementById("qrcode");

qr.innerHTML="";

const url=
window.location.origin+
window.location.pathname+
"?payment="+
encodeURIComponent(data.paymentId);

new QRCode(qr,{
text:url,
width:220,
height:220
});

}


async function payPayment(){

if(!payment)return;

provider=getProvider();

if(!provider){

alert("Phantom not found.");
return;

}

if(!wallet){

await connectWallet();

if(!wallet)return;

}


const button=document.getElementById("payButton");
const result=document.getElementById("paymentResult");

button.disabled=true;
button.innerText="Preparing...";

result.style.display="block";


try{

const {
Connection,
PublicKey,
SystemProgram,
Transaction,
LAMPORTS_PER_SOL
}=solanaWeb3;


const connection=new Connection(
"https://api.devnet.solana.com",
"confirmed"
);


const from=new PublicKey(wallet);

const to=new PublicKey(payment.merchant);

const lamports=Math.round(
payment.amount*LAMPORTS_PER_SOL
);


const transaction=new Transaction();

transaction.add(
SystemProgram.transfer({
fromPubkey:from,
toPubkey:to,
lamports
})
);


const latest=
await connection.getLatestBlockhash("confirmed");

transaction.recentBlockhash=
latest.blockhash;

transaction.feePayer=from;


button.innerText="Approve in Phantom";


const sent=
await provider.signAndSendTransaction(
transaction
);


const signature=sent.signature;


result.innerHTML=`
<span class="pending">
Transaction sent. Verifying...
</span>
`;


await connection.confirmTransaction(
{
signature,
blockhash:latest.blockhash,
lastValidBlockHeight:
latest.lastValidBlockHeight
},
"confirmed"
);


const verify=
await fetch(
API+
"/api/payments/"+
encodeURIComponent(payment.paymentId)+
"/verify",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
signature
})
}
);


const data=await verify.json();


if(data.paid){

result.innerHTML=`

<h2 class="success">
Payment Successful ✅
</h2>

<p>
Amount: ${data.amount} SOL
</p>

<p>
Status: <strong>Paid</strong>
</p>

<p>
Payment ID: ${data.paymentId}
</p>

<a
target="_blank"
href="https://explorer.solana.com/tx/${signature}?cluster=devnet"
style="color:#a78bfa"
>
View transaction on Solana Explorer
</a>
`;

button.innerText="Paid";

payment.status="Paid";

}else{

result.innerHTML=`
<span class="error">
${data.error || "Verification failed"}
</span>
`;

button.disabled=false;
button.innerText="Pay with Phantom";

}

}catch(error){

console.error(error);

result.innerHTML=`
<span class="error">
${error.message}
</span>
`;

button.disabled=false;
button.innerText="Pay with Phantom";

}

}


async function loadPayment(){

const params=
new URLSearchParams(window.location.search);

const paymentId=params.get("payment");

if(!paymentId)return;


try{

const response=
await fetch(
API+
"/api/payments/"+
encodeURIComponent(paymentId)
);

if(!response.ok)return;

const data=await response.json();

payment=data;

document.getElementById("paymentCard").style.display="block";

document.getElementById("paymentInfo").innerHTML=`

<p><strong>Payment ID:</strong><br>
${data.paymentId}</p>

<p><strong>Amount:</strong>
${data.amount} SOL</p>

<p><strong>Status:</strong>
${data.status}</p>

<p><strong>Merchant:</strong><br>
${data.merchant}</p>
`;

}catch(error){

console.error(error);

}

}

loadPayment();

</script>

</body>
</html>
