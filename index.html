<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>SolPay Africa</title>

<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;

  font-family:
    Arial,
    sans-serif;

  background:
    #0f172a;

  color:white;

}

header {

  padding:20px;

  background:#111827;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.logo {

  font-size:22px;

  font-weight:bold;

}

.network {

  color:#a78bfa;

  font-size:13px;

}

.container {

  max-width:1100px;

  margin:auto;

  padding:25px;

}

.grid {

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(300px,1fr)
    );

  gap:20px;

}

.card {

  background:#1e293b;

  padding:25px;

  border-radius:18px;

  margin-bottom:20px;

}

h1,h2 {

  margin-top:0;

}

input {

  width:100%;

  padding:13px;

  margin:
    7px 0 15px;

  background:#0f172a;

  color:white;

  border:
    1px solid #475569;

  border-radius:9px;

}

button {

  width:100%;

  padding:13px;

  border:0;

  border-radius:9px;

  background:#7c3aed;

  color:white;

  font-weight:bold;

  cursor:pointer;

  margin-top:8px;

}

button:hover {

  background:#6d28d9;

}

button:disabled {

  opacity:.5;

}

.wallet {

  margin-top:12px;

  padding:10px;

  background:#0f172a;

  border-radius:8px;

  font-size:12px;

  word-break:break-all;

}

.result {

  margin-top:15px;

  padding:15px;

  background:#0f172a;

  border-radius:10px;

  word-break:break-word;

}

.success {

  color:#4ade80;

}

.pending {

  color:#facc15;

}

.error {

  color:#f87171;

}

table {

  width:100%;

  border-collapse:collapse;

}

th,td {

  padding:10px;

  border-bottom:
    1px solid #334155;

  text-align:left;

  font-size:13px;

}

.qr {

  background:white;

  padding:15px;

  display:inline-block;

  border-radius:10px;

  margin-top:15px;

}

a {

  color:#a78bfa;

}

.small {

  color:#94a3b8;

  font-size:13px;

}

</style>

</head>


<body>


<header>

<div class="logo">
SolPay Africa
</div>

<div class="network">
Solana Devnet • Payment MVP
</div>

</header>


<div class="container">


<div class="grid">


<!-- CREATE PAYMENT -->

<div class="card">

<h2>
Create Payment
</h2>

<label>
Amount (SOL)
</label>

<input
  id="amount"
  type="number"
  step="0.000001"
  min="0.000001"
  placeholder="0.001"
>

<label>
Description
</label>

<input
  id="description"
  placeholder="Product or service"
>

<button
  onclick="createPayment()"
>
Create Payment
</button>

<div
  id="createResult"
  class="result"
  style="display:none"
></div>

</div>


<!-- WALLET -->

<div class="card">

<h2>
Customer Payment
</h2>

<button
  id="connectButton"
  onclick="connectWallet()"
>
Connect Phantom
</button>

<div
  id="wallet"
  class="wallet"
  style="display:none"
></div>

<div
  id="paymentBox"
  style="display:none"
>

<hr>

<h3>
Payment
</h3>

<div id="paymentInfo"></div>

<button
  id="payButton"
  onclick="payPayment()"
>
Pay with Phantom
</button>

<div
  id="paymentResult"
  class="result"
  style="display:none"
></div>

</div>

</div>

</div>


<!-- QR -->

<div
  id="qrCard"
  class="card"
  style="display:none"
>

<h2>
Payment QR
</h2>

<div
  id="qrcode"
  class="qr"
></div>

<p class="small">
Scan this QR code to open the SolPay payment page.
</p>

</div>


<!-- DASHBOARD -->

<div class="card">

<h2>
Merchant Dashboard
</h2>

<button
  onclick="loadPayments()"
>
Refresh Payments
</button>

<br><br>

<div
  style="overflow-x:auto"
>

<table>

<thead>

<tr>

<th>
Payment ID
</th>

<th>
Amount
</th>

<th>
Status
</th>

<th>
Created
</th>

</tr>

</thead>

<tbody
  id="paymentsTable"
>

</tbody>

</table>

</div>

</div>


</div>


<script>


const API_URL =
  "https://redouane2324-solpay.onrender.com";


let provider =
  null;

let walletPublicKey =
  null;

let currentPayment =
  null;


/*
========================================
PHANTOM
========================================
*/

function getProvider() {

  if (
    window.phantom &&
    window.phantom.solana
  ) {

    return window.phantom.solana;

  }

  if (
    window.solana &&
    window.solana.isPhantom
  ) {

    return window.solana;

  }

  return null;

}


/*
========================================
CONNECT
========================================
*/

async function connectWallet() {

  provider =
    getProvider();

  if (!provider) {

    alert(
      "Open this page in Phantom browser or install Phantom."
    );

    return;

  }

  try {

    const response =
      await provider.connect();

    walletPublicKey =
      response.publicKey.toString();

    document.getElementById(
      "connectButton"
    ).innerText =
      "Wallet Connected";

    const wallet =
      document.getElementById(
        "wallet"
      );

    wallet.style.display =
      "block";

    wallet.innerText =
      walletPublicKey;

  } catch(error) {

    console.error(error);

  }

}


/*
========================================
CREATE
========================================
*/

async function createPayment() {

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );

  const description =
    document.getElementById(
      "description"
    ).value ||
    "SolPay Payment";

  const result =
    document.getElementById(
      "createResult"
    );

  result.style.display =
    "block";

  result.innerHTML =
    "Creating payment...";


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    result.innerHTML =
      '<span class="error">Invalid amount.</span>';

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        "/api/payments",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              amount,

              description

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error
      );

    }


    currentPayment =
      data;


    showPayment(
      data
    );


    result.innerHTML = `

      <div class="success">
        Payment created successfully.
      </div>

      <p>
        Payment ID:
        <strong>
          ${data.paymentId}
        </strong>
      </p>

      <p>
        ${data.amount} SOL
      </p>

    `;


    createQR(
      data
    );


    loadPayments();


  } catch(error) {

    result.innerHTML =
      `<span class="error">${error.message}</span>`;

  }

}


/*
========================================
SHOW PAYMENT
========================================
*/

function showPayment(
  payment
) {

  document.getElementById(
    "paymentBox"
  ).style.display =
    "block";


  document.getElementById(
    "paymentInfo"
  ).innerHTML = `

    <p>
      <strong>Payment ID:</strong>
      ${payment.paymentId}
    </p>

    <p>
      <strong>Amount:</strong>
      ${payment.amount} SOL
    </p>

    <p>
      <strong>Description:</strong>
      ${payment.description}
    </p>

    <p>
      <strong>Status:</strong>
      <span class="pending">
        ${payment.status}
      </span>
    </p>

  `;

}


/*
========================================
QR
========================================
*/

function createQR(
  payment
) {

  const card =
    document.getElementById(
      "qrCard"
    );

  card.style.display =
    "block";


  const qr =
    document.getElementById(
      "qrcode"
    );

  qr.innerHTML =
    "";


  const url =
    window.location.origin +
    window.location.pathname +
    "?payment=" +
    encodeURIComponent(
      payment.paymentId
    );


  new QRCode(
    qr,
    {
      text:url,
      width:220,
      height:220
    }
  );

}


/*
========================================
PAY
========================================
*/

async function payPayment() {

  if (!currentPayment) {

    return;

  }


  provider =
    getProvider();


  if (!provider) {

    alert(
      "Phantom not found."
    );

    return;

  }


  if (!walletPublicKey) {

    await connectWallet();

    if (!walletPublicKey) {
      return;
    }

  }


  const button =
    document.getElementById(
      "payButton"
    );

  const result =
    document.getElementById(
      "paymentResult"
    );


  button.disabled =
    true;

  button.innerText =
    "Preparing transaction...";

  result.style.display =
    "block";


  try {

    const {
      Connection,
      PublicKey,
      SystemProgram,
      Transaction,
      TransactionInstruction,
      LAMPORTS_PER_SOL
    } = solanaWeb3;


    const connection =
      new Connection(
        "https://api.devnet.solana.com",
        "confirmed"
      );


    const from =
      new PublicKey(
        walletPublicKey
      );


    const to =
      new PublicKey(
        currentPayment.merchant
      );


    const lamports =
      Math.round(
        currentPayment.amount *
        LAMPORTS_PER_SOL
      );


    const transaction =
      new Transaction();


    /*
    ================================
    SOL TRANSFER
    ================================
    */

    transaction.add(

      SystemProgram.transfer({

        fromPubkey:
          from,

        toPubkey:
          to,

        lamports

      })

    );


    /*
    ================================
    PAYMENT MEMO
    ================================
    */

    const memoProgram =
      new PublicKey(
        "MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr"
      );


    const memoInstruction =
      new TransactionInstruction({

        keys: [],

        programId:
          memoProgram,

        data:
          new TextEncoder()
            .encode(
              currentPayment.paymentId
            )

      });


    transaction.add(
      memoInstruction
    );


    /*
    ================================
    BLOCKHASH
    ================================
    */

    const latest =
      await connection.getLatestBlockhash(
        "confirmed"
      );


    transaction.recentBlockhash =
      latest.blockhash;

    transaction.feePayer =
      from;


    /*
    ================================
    PHANTOM
    ================================
    */

    button.innerText =
      "Approve in Phantom...";


    const sent =
      await provider.signAndSendTransaction(
        transaction
      );


    const signature =
      sent.signature;


    result.innerHTML = `

      <div class="pending">
        Transaction sent.
      </div>

      <p>
        Waiting for confirmation...
      </p>

      <p>
        ${signature}
      </p>

    `;


    /*
    ================================
    CONFIRM
    ================================
    */

    await connection.confirmTransaction(

      {

        signature,

        blockhash:
          latest.blockhash,

        lastValidBlockHeight:
          latest.lastValidBlockHeight

      },

      "confirmed"

    );


    /*
    ================================
    BACKEND VERIFY
    ================================
    */

    result.innerHTML = `

      <div class="pending">
        Transaction confirmed.
      </div>

      <p>
        SolPay is verifying...
      </p>

    `;


    const response =
      await fetch(

        API_URL +
        "/api/payments/" +
        currentPayment.paymentId +
        "/verify",

        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              signature
            })

        }

      );


    const verification =
      await response.json();


    if (
      verification.paid
    ) {

      result.innerHTML = `

        <div class="success">

          <h2>
            Payment Successful ✅
          </h2>

        </div>

        <p>
          Payment ID:
          ${verification.paymentId}
        </p>

        <p>
          Amount:
          ${verification.amount} SOL
        </p>

        <p>
          Status:
          <strong>Paid</strong>
        </p>

        <p>

          <a
            target="_blank"
            href="https://explorer.solana.com/tx/${signature}?cluster=devnet"
          >
            View Transaction
          </a>

        </p>

      `;


      button.innerText =
        "Payment Completed";


      currentPayment.status =
        "Paid";


      loadPayments();


    } else {

      result.innerHTML = `

        <div class="error">
          Verification failed.
        </div>

        <p>
          ${verification.error || ""}
        </p>

      `;

      button.disabled =
        false;

      button.innerText =
        "Pay with Phantom";

    }


  } catch(error) {

    console.error(error);

    result.innerHTML = `

      <div class="error">
        Payment failed.
      </div>

      <p>
        ${error.message}
      </p>

    `;


    button.disabled =
      false;

    button.innerText =
      "Pay with Phantom";

  }

}


/*
========================================
DASHBOARD
========================================
*/

async function loadPayments() {

  const table =
    document.getElementById(
      "paymentsTable"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "/api/payments"
      );


    const payments =
      await response.json();


    table.innerHTML =
      "";


    payments.forEach(
      payment => {

        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${payment.paymentId}
          </td>

          <td>
            ${payment.amount} SOL
          </td>

          <td>
            <span class="${
              payment.status === "Paid"
                ? "success"
                : "pending"
            }">
              ${payment.status}
            </span>
          </td>

          <td>
            ${new Date(
              payment.createdAt
            ).toLocaleString()}
          </td>

        `;


        table.appendChild(
          row
        );

      }
    );


  } catch(error) {

    console.error(error);

  }

}


/*
========================================
OPEN PAYMENT FROM QR
========================================
*/

async function loadPaymentFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const paymentId =
    params.get(
      "payment"
    );


  if (!paymentId) {

    loadPayments();

    return;

  }


  try {

    const response =
      await fetch(

        API_URL +
        "/api/payments/" +
        encodeURIComponent(
          paymentId
        )

      );


    if (!response.ok) {

      throw new Error(
        "Payment not found"
      );

    }


    const payment =
      await response.json();


    currentPayment =
      payment;


    showPayment(
      payment
    );


  } catch(error) {

    console.error(error);

  }

}


loadPaymentFromURL();

</script>


</body>

</html>
