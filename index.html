<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolPay Africa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 25px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #0f172a;
      border-radius: 10px;
      display: none;
      word-break: break-word;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .payment-id {
      margin-top: 10px;
      color: #c4b5fd;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>SolPay Africa</h1>

      <div class="subtitle">
        Solana Payment Gateway
      </div>

      <label for="amount">
        Amount (SOL)
      </label>

      <input
        id="amount"
        type="number"
        step="0.000001"
        min="0.000001"
        placeholder="0.01"
      >

      <label for="description">
        Description
      </label>

      <input
        id="description"
        type="text"
        placeholder="Payment description"
      >

      <button onclick="createPayment()">
        Create Payment
      </button>

      <div id="result"></div>

    </div>

  </div>

<script>

const API_URL =
  "https://redouane2324-solpay.onrender.com";


async function createPayment() {

  const amount =
    document.getElementById("amount").value;

  const description =
    document.getElementById("description").value;

  const result =
    document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "Creating payment...";

  if (!amount || Number(amount) <= 0) {

    result.innerHTML =
      '<span class="error">Please enter a valid SOL amount.</span>';

    return;
  }

  try {

    const response =
      await fetch(
        API_URL + "/api/payments",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            amount:
              Number(amount),

            description:
              description ||
              "SolPay Payment"
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to create payment"
      );

    }

    result.innerHTML = `

      <div class="success">
        Payment created successfully!
      </div>

      <div class="payment-id">
        Payment ID:
        <strong>${data.paymentId}</strong>
      </div>

      <p>
        Amount:
        ${data.amount} SOL
      </p>

      <p>
        Status:
        ${data.status}
      </p>

      <p>
        Merchant:
        ${data.merchant}
      </p>

    `;

  } catch (error) {

    console.error(error);

    result.innerHTML = `
      <span class="error">
        ${error.message}
      </span>
    `;

  }

}

</script>

</body>
</html>
